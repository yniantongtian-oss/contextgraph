[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "contextgraph-ai"
version = "0.1.0"
description = "Python-first code graph retrieval for focused LLM and coding-agent context."
readme = "README.md"
license = {text = "MIT"}
authors = [
  {name = "ContextGraph Contributors"}
]
keywords = ["ai", "llm", "coding-assistant", "context", "graph", "rag", "code-intelligence"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0,<4",
    "rich>=13.0,<15",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
semantic = [
    "sentence-transformers>=2.2",
]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "twine>=5.1",
]

[project.scripts]
contextgraph = "contextgraph.cli:app"

[project.urls]
Homepage = "https://github.com/yniantongtian-oss/contextgraph"
Repository = "https://github.com/yniantongtian-oss/contextgraph"
Issues = "https://github.com/yniantongtian-oss/contextgraph/issues"
Changelog = "https://github.com/yniantongtian-oss/contextgraph/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/contextgraph"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
