[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contextgraph"
version = "0.1.0"
description = "Build and query intelligent code graphs for better LLM and AI agent context retrieval."
readme = "README.md"
license = {text = "MIT"}
authors = [
  {name = "ContextGraph Contributors"}
]
keywords = ["ai", "llm", "coding-assistant", "context", "graph", "rag", "agent", "code-intelligence"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "typer[all]>=0.9.0",
    "rich>=13.0",
]

[project.optional-dependencies]
semantic = [
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.scripts]
contextgraph = "contextgraph.cli:app"

[project.urls]
Homepage = "https://github.com/yniantongtian-oss/contextgraph"
Repository = "https://github.com/yniantongtian-oss/contextgraph"
Issues = "https://github.com/yniantongtian-oss/contextgraph/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/contextgraph"]
