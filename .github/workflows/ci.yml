name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        shell: bash
        run: |
          set +e
          ruff check src tests examples --output-format=concise 2>&1 | tee ruff-report.txt
          status=${PIPESTATUS[0]}
          echo "RUFF_EXIT_CODE=$status" >> "$GITHUB_ENV"
          exit "$status"
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-report
          path: ruff-report.txt
          if-no-files-found: ignore
      - name: Format check
        run: ruff format --check src tests examples
      - name: Build and validate package
        run: |
          python -m build
          python -m twine check dist/*

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: pytest --cov=contextgraph --cov-report=term-missing --cov-fail-under=80
